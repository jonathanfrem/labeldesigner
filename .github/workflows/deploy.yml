name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: labeldesigner-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            cd /srv/labeldesigner
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            git clean -fd -e node_modules -e dist
            npm ci
            npm run lint
            npx vitest run --passWithNoTests
            npx vitest run src/render/pdf --passWithNoTests
            npm run build
            systemctl restart labeldesigner.service
            sleep 3
            curl --fail --silent http://127.0.0.1:3210/ > /dev/null
            echo "Deployment successful."
